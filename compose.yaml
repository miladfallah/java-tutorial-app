services:
  academy-web:
    image: java-backend-academy:local
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile
    container_name: java-backend-academy
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD-SHELL", "wget --spider http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
